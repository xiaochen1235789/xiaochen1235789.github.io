<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="icon" href="/images/wangzhantupian.png" type="image/png">
    <title>小兹 · 智能助手</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0c0c0c;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* ---------- 顶部 ---------- */
        .chat-header {
            background: #0c0c0c; padding: 14px 16px 10px;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 0.5px solid #2c2c2e; flex-shrink: 0;
        }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
            background-image: url('https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/avatars/xzwink.webp');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-color: #4a3b2c;
        }
        .title h2 { font-size: 17px; font-weight: 600; color: #ffffff; letter-spacing: .3px; display: flex; align-items: center; }
        .badge {
            display: inline-block; font-size: 10px; font-weight: 500; letter-spacing: .3px;
            padding: 1px 7px; border-radius: 9px; margin-left: 7px; vertical-align: middle;
            background: #2c2c2e; color: #8e8e93; border: 0.5px solid #3a3a3c;
        }
        .badge.logged { background: rgba(48,209,88,.12); color: #30d158; border-color: rgba(48,209,88,.3); }
        .title p { font-size: 12px; color: #8e8e93; margin-top: 3px; display: flex; align-items: center; gap: 5px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #30d158; flex-shrink: 0; }
        .dot.busy { background: #ff9f0a; animation: pulse 1.1s ease-in-out infinite; }
        .dot.off  { background: #ff453a; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
        .icon-btn {
            margin-left: auto; background: none; border: none; color: #8e8e93;
            font-size: 17px; padding: 8px; cursor: pointer; border-radius: 50%;
        }
        .icon-btn:active { background: #1c1c1e; color: #ffffff; }
        /* 返回 WIKI：这个页面在 /ai sister/ 子目录里，进来后原路返回不方便 */
        .icon-btn.back {
            margin-left: 0; margin-right: 2px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 16px;
        }

        /* ---------- 消息区 ---------- */
        .messages-area {
            flex: 1; overflow-y: auto; padding: 14px 12px 8px;
            display: flex; flex-direction: column; gap: 4px;
            background: #0c0c0c; overscroll-behavior: contain;
        }
        .message { display: flex; align-items: flex-end; gap: 7px; max-width: 88%; margin-top: 8px; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai   { align-self: flex-start; }

        .mini-avatar {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            background-image: url('https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/avatars/xzwink.webp');
            background-size: cover; background-position: center; background-color: #4a3b2c;
        }
        .message.user .mini-avatar { display: none; }

        .bubble {
            padding: 9px 14px; border-radius: 18px; font-size: 15px; line-height: 1.5;
            word-wrap: break-word; word-break: break-word; white-space: normal;
            background: #1c1c1e; color: #ffffff; max-width: 100%;
        }
        .message.user .bubble { background: #0a84ff; border-bottom-right-radius: 5px; }
        .message.ai .bubble   { background: #26262a; border-bottom-left-radius: 5px; }
        .bubble b { font-weight: 600; }
        .bubble code {
            background: #3a3a3c; padding: 1px 5px; border-radius: 5px;
            font-size: 13px; font-family: ui-monospace, Menlo, monospace;
        }
        /* 流式输出时的光标 */
        .bubble.streaming::after {
            content: ''; display: inline-block; width: 7px; height: 15px;
            background: #0a84ff; margin-left: 2px; vertical-align: -2px;
            border-radius: 1px; animation: blink .9s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ---------- 时间分隔 ---------- */
        .time-sep {
            align-self: center; font-size: 11px; color: #636366;
            margin: 10px 0 2px; padding: 2px 10px;
        }

        /* ---------- 正在输入 ---------- */
        .typing .bubble { display: flex; align-items: center; gap: 7px; color: #8e8e93; font-size: 13px; }
        .dots { display: inline-flex; gap: 3px; align-items: center; }
        .dots i {
            width: 5px; height: 5px; border-radius: 50%; background: #8e8e93;
            animation: bounce 1.2s ease-in-out infinite;
        }
        .dots i:nth-child(2) { animation-delay: .15s; }
        .dots i:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

        /* ---------- 出错 ---------- */
        .message.error .bubble { background: #2a1b1e; color: #ffb4b0; font-size: 13.5px; }
        .retry {
            display: inline-block; margin-top: 7px; color: #0a84ff;
            font-size: 13px; cursor: pointer; border: none; background: none; padding: 0;
        }

        /* ---------- 输入区 ---------- */
        .input-area {
            background: #0c0c0c; border-top: 0.5px solid #2c2c2e;
            padding: 9px 12px; padding-bottom: max(9px, env(safe-area-inset-bottom));
            display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
        }
        #messageInput {
            flex: 1; background: #1c1c1e; border: 1px solid #2f2f33; border-radius: 22px;
            padding: 10px 16px; font-size: 15px; color: #ffffff; resize: none;
            max-height: 110px; font-family: inherit; line-height: 1.45;
        }
        #messageInput:focus { outline: none; border-color: #0a84ff; }
        #messageInput::placeholder { color: #636366; }
        .send-btn {
            background: #0a84ff; border: none; width: 42px; height: 42px; border-radius: 50%;
            color: #fff; font-size: 17px; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: opacity .15s, transform .1s;
        }
        .send-btn:disabled { background: #2c2c2e; color: #636366; cursor: default; }
        .send-btn:not(:disabled):active { transform: scale(.92); }

        /* ---------- 提示气泡 ---------- */
        .toast {
            position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 10px);
            background: #2c2c2e; color: #fff; font-size: 13px; padding: 8px 16px;
            border-radius: 20px; opacity: 0; pointer-events: none;
            transition: opacity .2s, transform .2s; z-index: 99; max-width: 80vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
</head>
<body>

<div class="chat-header">
    <a class="icon-btn back" href="/" aria-label="返回WIKI"><i class="fas fa-chevron-left"></i></a>
    <div class="avatar"></div>
    <div class="title">
        <h2>小兹<span class="badge" id="userBadge">连接中</span></h2>
        <p><span class="dot busy" id="statusDot"></span><span id="statusText">正在连接…</span></p>
    </div>
    <button class="icon-btn" id="clearBtn" aria-label="清空聊天"><i class="fas fa-trash-alt"></i></button>
</div>

<div class="messages-area" id="messagesArea"></div>

<div class="input-area">
    <textarea id="messageInput" rows="1" placeholder="想查点什么，或者就想聊两句也行～" disabled></textarea>
    <button class="send-btn" id="sendBtn" disabled aria-label="发送"><i class="fas fa-arrow-up"></i></button>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    // ================== 配置 ==================
    const SUPABASE_URL = 'https://ysmijycsyzpjoieaknmb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzbWlqeWNzeXpwam9pZWFrbm1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNDgzNjMsImV4cCI6MjA4MjgyNDM2M30.H7dx2k_0099LVXprMrghHOFh16OoSSgtCUOib2otHPA';
    const CHAT_ENDPOINT = SUPABASE_URL + '/functions/v1/chat';
    const SESSION_KEY = 'xz_chat_session_id';
    const MAX_INPUT = 2000;

    // ================== 元素 ==================
    const messagesArea = document.getElementById('messagesArea');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const toastEl = document.getElementById('toast');

    // ================== 状态 ==================
    const sb = window.supabase
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

    let authSession = null;
    let sessionId = localStorage.getItem(SESSION_KEY) || null;
    let streaming = false;
    let lastSentText = '';
    let lastTimeAnchor = 0;
    let booted = false;
    let userLabel = '查WIKI助手';

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // ================== 身份标识 ==================
    // 匿名用户 = 有 uid、但没邮箱没密码，记忆只跟着这台浏览器
    function isAnonymousUser(user) {
        if (!user) return true;
        if (typeof user.is_anonymous === 'boolean') return user.is_anonymous;
        return !user.email && !user.phone;   // 老版本 SDK 没这个字段时的兜底
    }

    function labelOf(user) {
        if (!user) return '未连接';
        if (isAnonymousUser(user)) return '游客';
        const meta = user.user_metadata || {};
        const name = meta.username || meta.name || meta.full_name
            || (user.email ? String(user.email).split('@')[0] : '')
            || (user.phone ? String(user.phone).slice(-4) : '');
        return name || '已登录';
    }

    function applyUser(user) {
        userLabel = labelOf(user);
        const anonymous = isAnonymousUser(user);
        const badge = document.getElementById('userBadge');
        if (badge) {
            badge.textContent = userLabel;
            badge.classList.toggle('logged', !anonymous);
            badge.title = anonymous
                ? '游客身份：记忆只保存在这台设备上，清浏览器数据会变成新的游客'
                : '已登录：对话记忆跟着账号走';
        }
        setStatus(streaming ? 'busy' : 'ok', streaming ? '小兹正在说…' : userLabel + ' · 在线');
    }

    // ================== 小工具 ==================
    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (m) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
        ));
    }

    // 只支持加粗、行内代码、换行——够用，又不会让回复变成文档
    function formatLite(str) {
        let h = escapeHtml(str);
        h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
        h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        h = h.replace(/\n/g, '<br>');
        return h;
    }

    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function setStatus(kind, text) {
        statusDot.className = 'dot' + (kind === 'ok' ? '' : kind === 'busy' ? ' busy' : ' off');
        statusText.textContent = text;
    }

    function nearBottom() {
        return messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight < 90;
    }
    function scrollToBottom(force) {
        if (force || nearBottom()) messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // ================== 渲染 ==================
    function addTimeSep(ts) {
        const d = new Date(ts || Date.now());
        if (d.getTime() - lastTimeAnchor < 5 * 60 * 1000) return;
        lastTimeAnchor = d.getTime();

        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        const label = sameDay
            ? time
            : d.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' }) + ' ' + time;

        const sep = document.createElement('div');
        sep.className = 'time-sep';
        sep.textContent = label;
        messagesArea.appendChild(sep);
    }

    function appendMessage(role, text) {
        const wrap = document.createElement('div');
        wrap.className = 'message ' + role;

        if (role === 'ai') {
            const av = document.createElement('div');
            av.className = 'mini-avatar';
            wrap.appendChild(av);
        }

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = formatLite(text);

        wrap.appendChild(bubble);
        messagesArea.appendChild(wrap);
        scrollToBottom();
        return { wrap, bubble };
    }

    // 正在输入的气泡：小头像 + 三点 + 一句话
    const TYPING_LINES = ['小兹在翻资料…', '等一下下，我看看…', '嗯……让我想想', '正在查 wiki…'];

    function appendTyping() {
        const wrap = document.createElement('div');
        wrap.className = 'message ai typing';

        const av = document.createElement('div');
        av.className = 'mini-avatar';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML =
            '<span class="dots"><i></i><i></i><i></i></span>' +
            '<span class="typing-text"></span>';

        wrap.appendChild(av);
        wrap.appendChild(bubble);
        messagesArea.appendChild(wrap);
        scrollToBottom(true);

        const label = bubble.querySelector('.typing-text');
        let i = Math.floor(Math.random() * TYPING_LINES.length);
        label.textContent = TYPING_LINES[i];
        const timer = setInterval(() => {
            i = (i + 1) % TYPING_LINES.length;
            label.textContent = TYPING_LINES[i];
        }, 2200);

        return {
            wrap,
            bubble,
            stop() {
                clearInterval(timer);
                wrap.remove();
            },
        };
    }

    function appendError(message, retryText) {
        const wrap = document.createElement('div');
        wrap.className = 'message ai error';

        const av = document.createElement('div');
        av.className = 'mini-avatar';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = message;

        if (retryText) {
            const btn = document.createElement('button');
            btn.className = 'retry';
            btn.textContent = '再试一次';
            btn.onclick = () => {
                wrap.remove();
                sendText(retryText, true);   // true = 别再把这条用户消息显示一遍
            };
            bubble.appendChild(document.createElement('br'));
            bubble.appendChild(btn);
        }

        wrap.appendChild(av);
        wrap.appendChild(bubble);
        messagesArea.appendChild(wrap);
        scrollToBottom(true);
    }

    // ================== 欢迎语（按时段） ==================
    function welcomeText() {
        const h = new Date().getHours();
        if (h >= 23 || h < 5) return '这个点还没睡呀…… 有什么想查的，小兹陪你一会儿。';
        if (h < 9) return '早呀～ 要查谁？小兹刚醒，脑子还在加载中。';
        if (h < 12) return '上午好呀～ 想问什么直接说，小兹在的。';
        if (h < 18) return '下午好～ 今天想翻 wiki 的哪一页？';
        return '晚上好呀～ 想查点什么？';
    }

    async function showWelcome() {
        messagesArea.innerHTML = '';
        lastTimeAnchor = 0;
        const { bubble } = appendMessage('ai', '');
        // 逐字打出来，比整段蹦出来自然
        const full = welcomeText();
        for (let i = 0; i < full.length; i++) {
            bubble.textContent = full.slice(0, i + 1);
            await sleep(24 + Math.random() * 22);
        }
    }

    // ================== 身份 ==================
    async function ensureAuth() {
        if (!sb) return false;
        try {
            const { data } = await sb.auth.getSession();
            if (data && data.session) {
                authSession = data.session;
                return true;
            }
            const { data: anon, error } = await sb.auth.signInAnonymously();
            if (error || !anon || !anon.session) {
                console.warn('[xz] 匿名登录失败：', error);
                return false;
            }
            authSession = anon.session;
            return true;
        } catch (e) {
            console.warn('[xz] 登录异常：', e);
            return false;
        }
    }

    // ================== 加载历史 ==================
    async function loadHistory() {
        if (!sessionId || !sb) {
            await showWelcome();
            return;
        }
        const { data, error } = await sb
            .from('chat_messages')
            .select('role,content,created_at')
            .eq('session_id', sessionId)
            .order('created_at', { ascending: false })   // 先取最近的
            .limit(60);

        if (error || !data || !data.length) {
            sessionId = null;
            localStorage.removeItem(SESSION_KEY);
            await showWelcome();
            return;
        }

        messagesArea.innerHTML = '';
        lastTimeAnchor = 0;
        for (const m of data.slice().reverse()) {        // 再翻回时间顺序
            addTimeSep(m.created_at);
            appendMessage(m.role === 'user' ? 'user' : 'ai', m.content);
        }
        scrollToBottom(true);
    }

    // ================== 发送 ==================
    function setBusy(busy) {
        streaming = busy;
        sendBtn.disabled = busy;
        if (busy) setStatus('busy', '小兹正在说…');
        else setStatus('ok', userLabel + ' · 在线');
    }

    // silent = 重试：不发用户气泡，只重新请求
    async function sendText(text, silent) {
        if (streaming) return;
        const clean = String(text || '').trim();
        if (!clean) return;
        if (clean.length > MAX_INPUT) {
            toast('话太长啦，小兹一次听不完，拆成几条好不好？');
            return;
        }
        if (!authSession) {
            toast('小兹还没连上，刷新一下页面试试～');
            return;
        }

        lastSentText = clean;
        if (!silent) {
            addTimeSep(Date.now());
            appendMessage('user', clean);
        }

        if (!silent) {
            input.value = '';
            autoResize();
        }
        sendBtn.disabled = true;
        setBusy(true);

        const typing = appendTyping();
        let res;
        try {
            res = await fetch(CHAT_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + authSession.access_token,
                    'apikey': SUPABASE_ANON_KEY,
                },
                body: JSON.stringify({ message: clean, session_id: sessionId }),
            });
        } catch (e) {
            typing.stop();
            setBusy(false);
            appendError('连不上小兹的服务器…… 可能是网络，也可能是站长还在部署。', clean);
            return;
        }

        if (!res.ok) {
            let msg = '小兹没接住这句话，再试一次？';
            try {
                const j = await res.json();
                if (j && j.error) msg = j.error;
            } catch (e) { /* 忽略 */ }
            typing.stop();
            setBusy(false);
            // 服务端返回的已经是人话，直接用；没有就用兜底
            appendError(msg, clean);
            return;
        }

        const sid = res.headers.get('x-session-id');
        if (sid && sid !== sessionId) {
            sessionId = sid;
            localStorage.setItem(SESSION_KEY, sid);
        }

        try {
            await pump(res, typing);
        } catch (e) {
            console.warn('[xz] 读取流失败：', e);
            typing.stop();
            appendError('小兹说到一半卡住了…… 再试一次？', clean);
        } finally {
            setBusy(false);
        }
    }

    // 把 SSE 边收边「打字」
    async function pump(res, typing) {
        if (!res.body) {
            const text = await res.text();
            typing.stop();
            appendMessage('ai', text || '……');
            return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let pending = '';
        let reading = true;
        let started = false;
        let bubbleRef = null;

        // 打字机：网络一次给一大段，这里按 1~2 字慢慢放出来，节奏才像人手打
        const typer = (async () => {
            while (reading || pending) {
                if (!pending) {
                    await sleep(18);
                    continue;
                }
                const take = 1 + (Math.random() < 0.35 ? 1 : 0);
                const piece = pending.slice(0, take);
                pending = pending.slice(take);

                if (!started) {
                    started = true;
                    typing.stop();                              // 三点换成真正的回复
                    bubbleRef = appendMessage('ai', '').bubble;
                    bubbleRef.classList.add('streaming');
                }

                bubbleRef.appendChild(document.createTextNode(piece));
                scrollToBottom();
                await sleep(13 + Math.random() * 30);
            }
        })();

        try {
            for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop() || '';
                for (const line of lines) {
                    const t = line.trim();
                    if (!t.startsWith('data:')) continue;
                    const data = t.slice(5).trim();
                    if (!data || data === '[DONE]') continue;
                    try {
                        const obj = JSON.parse(data);
                        const delta = obj && obj.choices && obj.choices[0] && obj.choices[0].delta
                            ? obj.choices[0].delta.content
                            : null;
                        if (delta) pending += delta;
                    } catch (e) { /* 半个 JSON，等下一块补上 */ }
                }
            }
        } finally {
            reading = false;
            await typer;
        }

        if (!started) {
            // 上游一个字都没给（极少见）
            typing.stop();
            appendMessage('ai', '……小兹刚才走神了，你再说一遍？');
            return;
        }

        // 收尾统一排版：加粗、行内代码、换行
        bubbleRef.classList.remove('streaming');
        bubbleRef.innerHTML = formatLite(bubbleRef.textContent || '');
        scrollToBottom(true);
    }

    // ================== 清空 ==================
    async function clearChat() {
        if (streaming) return;
        if (!confirm('清空之后，小兹也会忘记我们聊过什么。确定吗？')) return;

        if (sessionId && sb) {
            // 加 .select() 才能知道到底删掉没有（RLS 静默失败的老坑）
            const { data, error } = await sb
                .from('chat_sessions')
                .delete()
                .eq('id', sessionId)
                .select('id');
            if (error) console.warn('[xz] 删除会话失败：', error);
            else if (!data || !data.length) console.warn('[xz] 会话没删掉（可能权限策略）');
        }

        sessionId = null;
        localStorage.removeItem(SESSION_KEY);
        await showWelcome();
        toast('清空好啦，重新开始～');
    }

    // ================== 输入框 ==================
    function autoResize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 110) + 'px';
    }

    function bindEvents() {
        sendBtn.addEventListener('click', () => sendText(input.value));
        clearBtn.addEventListener('click', clearChat);
        input.addEventListener('input', autoResize);

        input.addEventListener('keydown', (e) => {
            // 中文输入法选词时的回车不能当成发送
            if (e.isComposing || e.keyCode === 229) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendText(input.value);
            }
        });
    }

    // ================== 启动 ==================
    async function boot() {
        if (booted) return;
        booted = true;
        bindEvents();
        setStatus('busy', '正在连接…');

        if (!sb) {
            setStatus('off', '连不上服务');
            appendError('Supabase SDK 没加载出来，刷新一下页面试试～');
            return;
        }

        // 主站登录过的话，这里直接复用；否则匿名登录
        const ok = await ensureAuth();
        if (!ok) {
            setStatus('off', '需要一点配置');
            appendError(
                '小兹还没醒过来。可能是站长还没开启「匿名登录」这个开关——' +
                '（给站长看的：Supabase → Authentication → Sign In / Providers → Anonymous 打开即可）。'
            );
            return;
        }

        if (sb.auth.onAuthStateChange) {
            sb.auth.onAuthStateChange((_event, s) => {
                if (s) {
                    authSession = s;
                    applyUser(s.user);
                }
            });
        }

        input.disabled = false;
        sendBtn.disabled = false;
        applyUser(authSession.user);
        input.focus();

        await loadHistory();
    }

    boot();
})();
</script>
</body>
</html>
