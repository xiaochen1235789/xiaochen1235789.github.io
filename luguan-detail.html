<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="UTF-8">
    <title>鹿将军 · 六哥荣耀WIKI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <meta name="description" content="鹿将军 · 巡猎·风·限定五星">
    <link rel="icon" href="https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/avatars/icon.webp" type="image/png">
    <link rel="preconnect" href="https://xiaochen1235789.github.io">
    <link rel="stylesheet" href="https://xiaochen1235789.github.io/css/tongyi.css">

    <style>
        .const-val,
        .skill-val {
            color: #E8C96B !important;
        }

            color: #E8C96B;
        }
        .hero-name,
        .top-bar .title {
            color: #E8C96B;

    </style>
</head>
<body>

    <!-- ===== 顶部栏 ===== -->
    <div class="top-bar">
        <span class="title" id="header-title">鹿将军 · 六哥荣耀.WIKI</span>
    </div>

    <!-- ===== 立绘区 ===== -->
    <section class="hero-section">
        <img class="hero-image" id="hero-image" src="" alt="鹿将军"
             onerror="this.style.display='none'; document.getElementById('hero-placeholder').style.display='flex';">
        <div id="hero-placeholder" style="display:none; width:100%; height:100%; align-items:center; justify-content:center; background:#1a1a2e; color:#666; font-size:1.2rem;">
            🖼️ 立绘加载失败
        </div>
        <div class="hero-overlay">
            <div class="hero-name" id="hero-name">鹿将军</div>
            <div class="tag-container" id="hero-tags">
                <span class="tag" id="hero-rarity">稀有度 ✮✮✮✮✮</span>
            </div>
        </div>
    </section>

    <!-- ===== 导航菜单 ===== -->
    <nav class="sticky-nav" id="stickyNav" aria-label="板块导航">
        <button class="nav-item active" data-group="base">📋 基础信息</button>
        <span class="nav-divider">·</span>
        <button class="nav-item" data-group="skill">⚔️ 技能与星魂</button>
        <span class="nav-divider">·</span>
        <button class="nav-item" data-group="team">🤝 配队推荐</button>
    </nav>

    <!-- ========================================================= -->
    <!-- 基础信息组 -->
    <!-- ========================================================= -->
    <section class="card" id="base-attr" data-group="base">
        <div class="skill-header">
            <div class="skill-name" id="base-level-label">基础属性 Lv.90</div>
            <div class="level-controls">
                <button class="level-btn down" id="base-level-down">↓</button>
                <span class="level-value" id="base-level-display">90</span>
                <button class="level-btn up" id="base-level-up">↑</button>
                <span style="color: var(--sub-text); font-size: 0.9rem;">自由滑动</span>
                <input type="range" id="base-level-slider" class="base-slider" min="1" max="90" value="90" step="1">
            </div>
        </div>
        <div class="skill-content">
            <div class="attr-container">
                <div class="attr-row" id="path-elements"></div>
            </div>
            <div class="attr-container">
                <div class="attr-row" id="base-stats"></div>
            </div>
        </div>
    </section>

    <!-- 晋级材料 -->
    <section class="card promotion-card" id="promotion-card" data-group="base">
        <div class="skill-header"><div class="skill-name">📦 晋级材料</div></div>
        <div class="skill-content">
            <div class="promotion-materials" id="promotion-materials"></div>
            <div class="promotion-next" id="promotion-next"></div>
            <div class="consumed-title" id="consumed-title">📜 已消耗材料（Lv.1 → Lv.90）</div>
            <div class="consumed-materials" id="consumed-materials"></div>
        </div>
    </section>

    <!-- ========================================================= -->
    <!-- 技能与星魂组 -->
    <!-- ========================================================= -->
    <section class="card" id="normal-attack" data-group="skill">
        <div class="skill-header">
            <div class="skill-name" id="normal-name">普攻</div>
            <div class="level-controls">
                <button class="level-btn down" id="normal-down">↓</button>
                <span class="level-value" id="normal-level">1/7</span>
                <button class="level-btn up" id="normal-up">↑</button>
            </div>
        </div>
        <div class="skill-content">
            <div id="normal-desc">技能描述</div>
            <table class="data-table"><thead><tr><th>隐藏数值</th><th>数值</th></tr></thead><tbody id="normal-details"></tbody></table>
        </div>

    <section class="card" id="skill-attack" data-group="skill">
        <div class="skill-header">
            <div class="skill-name" id="skill-name">战技</div>
            <div class="level-controls">
                <button class="level-btn down" id="skill-down">↓</button>
                <span class="level-value" id="skill-level">1/12</span>
                <button class="level-btn up" id="skill-up">↑</button>
            </div>
        </div>
        <div class="skill-content">
            <div id="skill-desc">技能描述</div>
            <table class="data-table"><thead><tr><th>隐藏数值</th><th>数值</th></tr></thead><tbody id="skill-details"></tbody></table>
        </div>
    </section>

    <section class="card" id="ultimate-attack" data-group="skill">
        <div class="skill-header">
            <div class="skill-name" id="ultimate-name">终结技</div>
            <div class="level-controls">
                <button class="level-btn down" id="ultimate-down">↓</button>
                <span class="level-value" id="ultimate-level">1/12</span>
                <button class="level-btn up" id="ultimate-up">↑</button>
            </div>
        </div>
        <div class="skill-content">
            <div id="ultimate-desc">技能描述</div>
            <table class="data-table"><thead><tr><th>隐藏数值</th><th>数值</th></tr></thead><tbody id="ultimate-details"></tbody></table>
        </div>
    </section>

    <section class="card" id="talent-attack" data-group="skill">
        <div class="skill-header">
            <div class="skill-name" id="talent-name">天赋</div>
            <div class="level-controls">
                <button class="level-btn down" id="talent-down">↓</button>
                <span class="level-value" id="talent-level">1/12</span>
                <button class="level-btn up" id="talent-up">↑</button>
            </div>
        </div>
        <div class="skill-content">
            <div id="talent-desc">技能描述</div>
            <table class="data-table"><thead><tr><th>隐藏数值</th><th>数值</th></tr></thead><tbody id="talent-details"></tbody></table>
        </div>
    </section>

    <section class="card" id="trace-bonus" data-group="skill">
        <div class="section-title">行迹加成(总)</div>
        <div class="attr-row" id="trace-stats"></div>
    </section>

    <section class="card" id="extra-abilities" data-group="skill">
        <div class="section-title">额外能力</div>
        <div id="extra-abilities-list"></div>
    </section>

    <section class="card" id="constellations" data-group="skill">
        <div class="section-title">命之座 · 星魂</div>
        <table class="constellation-table">
            <thead><tr><th>层数</th><th>名称</th><th>效果</th></tr></thead>
            <tbody id="constellation-body"></tbody>
        </table>
    </section>

    <!-- ========================================================= -->
    <!-- 配队推荐组 -->
    <!-- ========================================================= -->
    <section class="card team-section" id="team-comp" data-group="team">
        <div class="skill-header">
            <div class="skill-name" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                ⚔️ 配队推荐
                <span style="font-size:0.7rem;font-weight:400;color:var(--sub-text,#889999);">点击选项卡切换配队方案</span>
            </div>
        </div>
        <div class="skill-content">
            <div class="team-tabs" id="teamTabs"></div>
            <div class="team-panels" id="teamPanels"></div>
        </div>
    </section>

    <!-- ===== 底部 ===== -->
    <footer class="wiki-footer">
        © <span id="year"></span> 六哥荣耀WIKI. 本WIKI纯属虚构娱乐.<br>
        本WIKI所有图片均由AI生成，不存在侵权行为，请仔细辨别.
    </footer>

    <!-- ===== 回到顶部 ===== -->
    <button class="back-top" id="backTop" aria-label="回到顶部" title="回到顶部">↑</button>

    <!-- ============================================================ -->
    <!-- ===== JavaScript（修复：技能点击不再跳转） ===== -->
    <!-- ============================================================ -->
    <script>
        // ======================== 配置 ========================
        const SUPABASE_URL = 'https://ysmijycsyzpjoieaknmb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzbWlqeWNzeXpwam9pZWFrbm1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNDgzNjMsImV4cCI6MjA4MjgyNDM2M30.H7dx2k_0099LVXprMrghHOFh16OoSSgtCUOib2otHPA';
        const CHAR_ID = 'deer-general';

        // ★★★ 硬编码插值表（鹿将军专属） ★★★
        const BASE_LEVEL_PRESETS = [1, 20, 30, 40, 50, 60, 70, 80, 90];
        const BASE_STATS_MAP = {
            1: { hp: 126, atk: 87, def: 49 },
            20: { hp: 297, atk: 204, def: 116 },
            30: { hp: 411, atk: 283, def: 160 },
            40: { hp: 525, atk: 361, def: 205 },
            50: { hp: 639, atk: 439, def: 249 },
            60: { hp: 753, atk: 518, def: 294 },
            70: { hp: 868, atk: 596, def: 339 },
            80: { hp: 931, atk: 640, def: 363 },
            90: { hp: 1024.1, atk: 704, def: 399.3 }
        };

        function interpolateStats(level) {
            if (level <= 1) return { hp: Math.round(BASE_STATS_MAP[1].hp), atk: Math.round(BASE_STATS_MAP[1].atk), def: Math.round(BASE_STATS_MAP[1].def) };
            if (level >= 90) return { hp: Math.round(BASE_STATS_MAP[90].hp), atk: Math.round(BASE_STATS_MAP[90].atk), def: Math.round(BASE_STATS_MAP[90].def) };
            let lower = 1,
                upper = 90;
            for (let i = 0; i < BASE_LEVEL_PRESETS.length - 1; i++) {
                if (level >= BASE_LEVEL_PRESETS[i] && level <= BASE_LEVEL_PRESETS[i + 1]) {
                    lower = BASE_LEVEL_PRESETS[i];
                    upper = BASE_LEVEL_PRESETS[i + 1];
                    break;
                }
            }
            const lowStats = BASE_STATS_MAP[lower];
            const highStats = BASE_STATS_MAP[upper];
            const t = (level - lower) / (upper - lower);
            return {
                hp: Math.round(lowStats.hp + t * (highStats.hp - lowStats.hp)),
                atk: Math.round(lowStats.atk + t * (highStats.atk - lowStats.atk)),
                def: Math.round(lowStats.def + t * (highStats.def - lowStats.def))
            };
        }

        let supabaseClient = null;
        let currentUser = null;
        let charData = null;
        let userProgress = null;
        let globalMaterials = {};
        let currentBaseLevel = 90;

        // ======================== 硬编码中文回退 ========================
        const FALLBACK_MATERIALS = {
            'sugar': { name: '糖果碎', image_url: 'https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/items/props/Crushed_sugar.webp' },
            'candy': { name: '超级棒糖', image_url: 'https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/items/props/Super_Sweet.webp' },
            'wind_shard': { name: '清风碎片', image_url: 'https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/items/materials/wind_jinji_1.webp' },
            'wind_chip': { name: '御风晶片', image_url: 'https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/items/materials/wind_jinji_2.webp' },
            'wind_core': { name: '万风核心', image_url: 'https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/items/materials/wind_jinji_3.webp' },
            'crystal': { name: '纯白祈愿结晶', image_url: 'https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/items/materials/none_tongyong_001.webp' }
        };

        // ======================== DOM ========================
        function $(id) { return document.getElementById(id); }

        // ======================== Supabase ========================
        async function initSupabase() {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                auth: { persistSession: true }
            });
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) currentUser = session.user;
        }

        // ======================== 加载数据 ========================
        async function loadCharacterData() {
            const sb = supabaseClient;
            const { data: detail, error: detailErr } = await sb
                .from('character_details')
                .select('*')
                .eq('id', CHAR_ID)
                .single();
            if (detailErr) throw new Error('角色数据加载失败: ' + detailErr.message);
            charData = detail;

            const { data: mats, error: matErr } = await sb
                .from('global_materials')
                .select('*');
            if (!matErr && mats && mats.length > 0) {
                mats.forEach(m => { globalMaterials[m.id] = m; });
            }
            const merged = { ...FALLBACK_MATERIALS };
            if (!matErr && mats) {
                mats.forEach(m => { merged[m.id] = m; });
            }
            globalMaterials = merged;

            if (currentUser) {
                const { data: prog, error: progErr } = await sb
                    .from('user_char_progress')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('char_id', CHAR_ID)
                    .single();
                if (!progErr && prog) {
                    userProgress = prog;
                }
            }
            if (!userProgress) {
                userProgress = {
                    normal_level: 1,
                    skill_level: 1,
                    ultimate_level: 1,
                    talent_level: 1,
                    enhanced_normal_level: 1,
                    enhanced_skill_level: 1,
                    enhanced_ultimate_level: 1,
                    memetic_skill_level: 1,
                    memetic_talent_level: 1,
                    base_level: 90
                };
            }
            currentBaseLevel = userProgress.base_level || 90;

            renderPage();
        }

        // ======================== 渲染基础属性行 ========================
        function renderBaseStatsRow(level) {
            const stats = interpolateStats(level);
            const container = $('base-stats');
            if (!container) return;
            container.innerHTML = `
                <div class="attr-icon">
                    <img src="https://xiaochen1235789.github.io/attribute_image/HP.webp" alt="生命">
                    <div class="attr-value" id="base-hp">${stats.hp}</div>
                    <div class="attr-label">生命</div>
                </div>
                <div class="attr-icon">
                    <img src="https://xiaochen1235789.github.io/attribute_image/ATK.webp" alt="攻击">
                    <div class="attr-value" id="base-atk">${stats.atk}</div>
                    <div class="attr-label">攻击</div>
                </div>
                <div class="attr-icon">
                    <img src="https://xiaochen1235789.github.io/attribute_image/DEF.webp" alt="防御">
                    <div class="attr-value" id="base-def">${stats.def}</div>
                    <div class="attr-label">防御</div>
                </div>
                <div class="attr-icon">
                    <img src="https://xiaochen1235789.github.io/attribute_image/SPD.webp" alt="速度">
                    <div class="attr-value" id="base-spd">${charData?.base_stats?.spd || 115}</div>
                    <div class="attr-label">速度</div>
                </div>
                <div class="attr-icon">
                    <img src="https://xiaochen1235789.github.io/attribute_image/ENERGY.webp" alt="能量">
                    <div class="attr-value" id="base-energy">${charData?.base_stats?.energy || 120}</div>
                    <div class="attr-label">能量</div>
                </div>
            `;
        }

        // ======================== 更新基础属性 ========================
        function updateBaseAttributes(level) {
            currentBaseLevel = level;
            const stats = interpolateStats(level);
            $('base-level-label').innerText = `基础属性 Lv.${level}`;
            $('base-level-display').textContent = level;
            $('base-level-slider').value = level;

            const hpEl = document.getElementById('base-hp');
            const atkEl = document.getElementById('base-atk');
            const defEl = document.getElementById('base-def');
            if (hpEl) hpEl.textContent = stats.hp;
            if (atkEl) atkEl.textContent = stats.atk;
            if (defEl) defEl.textContent = stats.def;

            const spdEl = document.getElementById('base-spd');
            const energyEl = document.getElementById('base-energy');
            if (spdEl && charData) spdEl.textContent = charData.base_stats?.spd || 115;
            if (energyEl && charData) energyEl.textContent = charData.base_stats?.energy || 120;

            renderMaterials(level);
        }

        // ======================== 渲染 ========================
        function renderPage() {
            if (!charData) return;

            // ---- 标题/立绘 ----
            document.title = charData.name + ' · 六哥荣耀WIKI';
            $('header-title').textContent = charData.name + ' · 六哥荣耀.WIKI';
            $('hero-name').textContent = charData.name;
            const img = $('hero-image');
            const placeholder = $('hero-placeholder');
            if (charData.image_url) {
                img.src = charData.image_url;
                img.style.display = '';
                placeholder.style.display = 'none';
            } else {
                img.style.display = 'none';
                placeholder.style.display = 'flex';
            }
            $('hero-rarity').textContent = '稀有度 ✮✮✮✮✮';

            // ---- 命途/属性 ----
            $('path-elements').innerHTML = `
                <div class="attr-icon"><img src="https://xiaochen1235789.github.io/attribute_image/Hunt.webp" alt="巡猎"><div class="attr-label">巡猎</div></div>
                <div class="attr-icon"><img src="https://xiaochen1235789.github.io/Wind.webp" alt="风"><div class="attr-label">风</div></div>
                <div class="attr-icon"><div class="attr-label">限定五星</div></div>
            `;

            // ---- 基础属性（插值） ----
            renderBaseStatsRow(currentBaseLevel);

            // ---- 行迹 ----
            if (charData.trace_stats) {
                $('trace-stats').innerHTML = charData.trace_stats.map(s => `
                    <div class="attr-icon"><img src="https://xiaochen1235789.github.io/attribute_image/${s.icon}" alt="${s.label}"><div class="attr-value">${s.value}</div><div class="attr-label">${s.label}</div></div>
                `).join('');
            }

            // ---- 额外能力 ----
            if (charData.extra_abilities) {
                $('extra-abilities-list').innerHTML = charData.extra_abilities.map(a => `
                    <div class="ability-item"><div class="ability-name">${a.name}</div><div class="ability-desc">${a.desc}</div></div>
                `).join('');
            }

            // ---- 星魂 ----
            if (charData.constellations) {
                $('constellation-body').innerHTML = charData.constellations.map(c => `
                    <tr><td>${c.level}</td><td>${c.name}</td><td>${c.effect}</td></tr>
                `).join('');
            }

            // ---- 技能 ----
            const skillKeys = ['normal', 'skill', 'ultimate', 'talent'];
            skillKeys.forEach(key => {
                const skill = charData.skills[key];
                if (!skill) return;
                const levelKey = key + '_level';
                const level = userProgress[levelKey] || 1;
                const maxLevel = skill.maxLevel || 10;

                const nameEl = $(`${key}-name`);
                const levelEl = $(`${key}-level`);
                const descEl = $(`${key}-desc`);
                const detailsEl = $(`${key}-details`);

                if (nameEl) nameEl.textContent = skill.name;
                if (levelEl) {
                    levelEl.textContent = `${level}/${maxLevel}`;
                    if (level === maxLevel) levelEl.style.color = '#FFD700';
                    else levelEl.style.color = '#E8C96B';
                }
                if (descEl) descEl.innerHTML = skill.desc;
                if (detailsEl && skill.details) {
                    detailsEl.innerHTML = skill.details.map(d => `<tr><td>${d.label}</td><td>${d.value}</td></tr>`).join('');
                }

                if (skill.values) {
                    skill.values.forEach(v => {
                        const el = document.getElementById(v.id);
                        if (el) {
                            const val = v.base + v.step * (level - 1);
                            let display = Number.isInteger(val) ? val.toString() : val.toFixed(1);
                            if (v.suffix === '%') {
                                if (display.endsWith('.0')) display = display.slice(0, -2);
                                display = display + '%';
                            }
                            el.textContent = display;
                            if (level === maxLevel) el.style.color = '#FFD700';
                            else el.style.color = '#E8C96B';
                        }
                    });
                }

                const downBtn = $(`${key}-down`);
                const upBtn = $(`${key}-up`);
                if (downBtn) {
                    downBtn.onclick = () => changeSkillLevel(key, -1);
                    downBtn.disabled = level <= 1;
                }
                if (upBtn) {
                    upBtn.onclick = () => changeSkillLevel(key, 1);
                    upBtn.disabled = level >= maxLevel;
                }
            });

            // ---- 材料 ----
            renderMaterials(currentBaseLevel);

            // ---- 配队 ----
            if (charData.teams) {
                renderTeams(charData.teams);
            }

            // ---- 基础等级事件 ----
            bindBaseLevelEvents();

            // ★★★ 移除这里的 setupNavigation() 调用，避免重置导航 ★★★
            // 但需要确保 backTop 事件只绑定一次，所以在 init 中绑定
        }

        // ======================== 基础等级控件 ========================
        function bindBaseLevelEvents() {
            const slider = $('base-level-slider');
            const downBtn = $('base-level-down');
            const upBtn = $('base-level-up');

            const updateBase = (val) => {
                let level = Math.min(90, Math.max(1, parseInt(val, 10) || 90));
                if (level === currentBaseLevel) return;
                userProgress.base_level = level;
                updateBaseAttributes(level);
                if (currentUser) {
                    supabaseClient
                        .from('user_char_progress')
                        .upsert({
                            user_id: currentUser.id,
                            char_id: CHAR_ID,
                            base_level: level
                        }, { onConflict: 'user_id, char_id' })
                        .then(({ error }) => {
                            if (error) console.warn('基础等级保存失败', error);
                        });
                }
            };

            if (slider) {
                slider.oninput = (e) => updateBase(e.target.value);
            }
            if (downBtn) {
                downBtn.onclick = () => updateBase(currentBaseLevel - 1);
                downBtn.disabled = currentBaseLevel <= 1;
            }
            if (upBtn) {
                upBtn.onclick = () => updateBase(currentBaseLevel + 1);
                upBtn.disabled = currentBaseLevel >= 90;
            }
        }

        // ======================== 材料渲染 ========================
        function renderMaterials(level) {
            const stages = charData.promotion_stages || [];
            const container = $('promotion-materials');
            const nextText = $('promotion-next');
            const consumedContainer = $('consumed-materials');
            const titleEl = $('consumed-title');

            function getMaterialInfo(key) {
                if (globalMaterials[key]) return globalMaterials[key];
                if (FALLBACK_MATERIALS[key]) return FALLBACK_MATERIALS[key];
                return { name: key, image_url: null };
            }

            let nextStage = null;
            for (let s of stages) {
                if (level < s.targetLevel) { nextStage = s; break; }
            }

            if (!nextStage) {
                container.innerHTML = '<div style="text-align:center; padding:20px;">✨ 所有晋级已完成 ✨</div>';
                nextText.innerHTML = '';
            } else {
                let html = '';
                for (let mat of nextStage.materials) {
                    const material = getMaterialInfo(mat.key);
                    const imgHtml = material.image_url ?
                        `<img src="${material.image_url}" alt="${material.name}" style="width:40px;height:40px;object-fit:contain;" onerror="this.parentNode.innerHTML='❓'">` :
                        `<span style="font-size:28px;">❓</span>`;
                    html += `
                        <div class="material-item" style="display:inline-block;margin:8px;text-align:center;">
                            <div class="material-img">${imgHtml}</div>
                            <div class="material-name">${material.name}</div>
                            <div class="material-count">× ${mat.count}</div>
                        </div>
                    `;
                }
                container.innerHTML = html;
                nextText.innerHTML = `⬆ 等级上限提高至 Lv.${nextStage.targetLevel + 10} 所需材料`;
            }

            const consumed = stages.filter(s => s.targetLevel <= level);
            if (consumed.length === 0) {
                if (titleEl) titleEl.textContent = '📜 已消耗材料（Lv.1）';
                consumedContainer.innerHTML = '<div style="text-align:center; padding:20px;">暂无消耗</div>';
                return;
            }
            if (titleEl) titleEl.textContent = `📜 已消耗材料（Lv.1 → Lv.${level}）`;
            const total = {};
            consumed.forEach(s => {
                s.materials.forEach(mat => {
                    if (!total[mat.key]) total[mat.key] = 0;
                    total[mat.key] += mat.count;
                });
            });
            let html = '';
            for (let [key, count] of Object.entries(total)) {
                const material = getMaterialInfo(key);
                const imgHtml = material.image_url ?
                    `<img src="${material.image_url}" alt="${material.name}" style="width:40px;height:40px;object-fit:contain;" onerror="this.parentNode.innerHTML='❓'">` :
                    `<span style="font-size:28px;">❓</span>`;
                html += `
                    <div class="material-item" style="display:inline-block;margin:8px;text-align:center;">
                        <div class="material-img">${imgHtml}</div>
                        <div class="material-name">${material.name}</div>
                        <div class="material-count">× ${count}</div>
                    </div>
                `;
            }
            consumedContainer.innerHTML = html;
        }

        // ======================== 配队渲染 ========================
        function renderTeams(teams) {
            const tabsContainer = $('teamTabs');
            const panelsContainer = $('teamPanels');
            if (!tabsContainer || !panelsContainer) return;

            tabsContainer.innerHTML = teams.map((t, i) => `
                <button class="tab-btn ${i === 0 ? 'active' : ''}" data-team="${t.id}">${t.icon} ${t.name}</button>
            `).join('');

            panelsContainer.innerHTML = teams.map((t, i) => `
                <div class="team-panel ${i === 0 ? 'active' : ''}" data-team="${t.id}">
                    <div class="team-roles">
                        ${t.roles.map(r => `
                            <div class="team-role">
                                <div class="team-avatar" data-role="${r.char}">
                                    <span class="avatar-char">${r.initial}</span>
                                    <span class="avatar-label">占位</span>
                                </div>
                                <div class="role-name">${r.char} · ${r.role}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="team-desc">
                        <strong>${t.icon} ${t.name}</strong> — ${t.desc}<br>
                        <span class="tag">核心</span> ${t.core}<br>
                        <span class="tag">生存</span> ${t.survival}
                    </div>
                    <div class="team-gear">
                        <span><span class="gear-label">🎯 推荐光锥：</span>${t.lightcone}</span>
                        <span><span class="gear-label">⚙️ 推荐遗器：</span>${t.relic}</span>
                    </div>
                </div>
            `).join('');

            tabsContainer.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = () => {
                    tabsContainer.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const id = btn.dataset.team;
                    panelsContainer.querySelectorAll('.team-panel').forEach(p => p.classList.remove('active'));
                    const target = panelsContainer.querySelector(`.team-panel[data-team="${id}"]`);
                    if (target) target.classList.add('active');
                };
            });
        }

        // ======================== 技能等级 ========================
        async function changeSkillLevel(key, delta) {
            const skill = charData.skills[key];
            if (!skill) return;
            const levelKey = key + '_level';
            const currentLevel = userProgress[levelKey] || 1;
            const newLevel = currentLevel + delta;
            if (newLevel < 1 || newLevel > skill.maxLevel) return;

            userProgress[levelKey] = newLevel;
            renderPage();

            if (!currentUser) {
                showToast('请先登录，否则等级不会保存！', 'warning');
                return;
            }

            const updateObj = {
                user_id: currentUser.id,
                char_id: CHAR_ID,
                [levelKey]: newLevel,
                base_level: userProgress.base_level || 90
            };

            const { error } = await supabaseClient
                .from('user_char_progress')
                .upsert(updateObj, { onConflict: 'user_id, char_id' });

            if (error) {
                console.error('保存失败', error);
                showToast('保存失败，请重试', 'error');
                userProgress[levelKey] = currentLevel;
                renderPage();
            }
        }

        // ======================== Toast ========================
        function showToast(msg, type = 'info') {
            const old = document.querySelector('.custom-toast');
            if (old) old.remove();
            const div = document.createElement('div');
            div.className = 'custom-toast';
            div.style.cssText = `
                position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
                padding: 12px 24px; border-radius: 12px; background: ${type === 'error' ? '#dc2626' : '#3b82f6'};
                color: #fff; font-weight: 500; z-index: 9999; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
                max-width: 90%; text-align: center;
            `;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // ======================== 导航（只绑定一次，不重置） ========================
        function setupNavigation() {
            const navItems = document.querySelectorAll('.sticky-nav .nav-item');
            const allCards = document.querySelectorAll('section.card[data-group]');

            function showGroup(group) {
                allCards.forEach(card => {
                    const cardGroup = card.getAttribute('data-group');
                    card.style.display = (cardGroup === group) ? '' : 'none';
                });
                navItems.forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-group') === group);
                });
            }

            navItems.forEach(btn => {
                btn.addEventListener('click', function() {
                    const group = this.getAttribute('data-group');
                    if (!group) return;
                    showGroup(group);
                });
            });

            // 默认显示 base
            showGroup('base');
        }

        function setupBackTop() {
            const backTop = $('backTop');
            window.addEventListener('scroll', () => {
                backTop.classList.toggle('visible', window.pageYOffset > 400);
            });
            backTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ======================== 启动 ========================
        async function init() {
            await initSupabase();
            await loadCharacterData();
            // ★★★ 导航只初始化一次，不再由 renderPage 重置 ★★★
            setupNavigation();
            setupBackTop();
            $('year').textContent = new Date().getFullYear();
        }

        document.addEventListener('DOMContentLoaded', init);
        window.changeSkillLevel = changeSkillLevel;
    </script>
</body>
</html>
