<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的邮箱 - 六哥荣耀</title>
    <link rel="icon" href="https://xiaochen1235789.github.io/images/wangzhantupian.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 重置与基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0f1e;
            color: #eef2ff;
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            padding-left: calc(20px + env(safe-area-inset-left, 0px));
            padding-right: calc(20px + env(safe-area-inset-right, 0px));
            min-height: 100vh;
            min-height: 100dvh;
            transition: padding 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }
        body.embedded {
            padding: 8px 12px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            background: transparent;
        }
        body.embedded .mail-layout { gap: 10px; }
        body.embedded .mail-list-section h2 { font-size: 1.1rem; margin-bottom: 10px; }
        body.embedded .mail-item { padding: 10px 12px; border-radius: 10px; }
        body.embedded .detail-panel { border-radius: 14px; padding: 14px; }
        body.embedded .mail-detail-section { border-radius: 14px; padding: 14px; }
        body.embedded .email-close-btn { display: inline-flex !important; }

        .mail-layout {
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            gap: 20px;
        }
        @media (min-width: 768px) and (orientation: landscape) {
            .mail-layout { flex-direction: row; align-items: flex-start; }
            .mail-list-section { flex: 1.2; min-width: 280px; max-width: 400px; }
            .mail-detail-section {
                flex: 2;
                background: #1e293b;
                border-radius: 28px;
                padding: 20px;
                min-height: 70vh;
                position: sticky;
                top: 20px;
            }
            .modal:not(.reward-modal):not(.info-modal):not(.confirm-modal):not(.item-detail-modal) { display: none !important; }
            .detail-panel-close { display: inline-flex !important; }
        }
        @media (max-width: 767px), (orientation: portrait) {
            .mail-detail-section { display: none; }
        }

        /* ===== 邮件列表 ===== */
        .mail-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .mail-item {
            background: #1e293b;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            border-left: 3px solid transparent;
        }
        .mail-item.selected {
            border-left-color: #facc15;
            background: #2a3f5e;
        }
        .mail-item.unread {
            border-left-color: #facc15;
            background: #2a3f5e;
        }
        .mail-item:active { transform: scale(0.99); }

        .mail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 6px;
        }
        .mail-title {
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mail-meta {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .mail-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .claim-btn {
            background: #f59e0b;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            color: #1e293b;
            transition: opacity 0.2s;
            min-height: 36px;
        }
        .claim-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .claimed-badge {
            font-size: 0.75rem;
            color: #10b981;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #f87171;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .delete-btn:active { background: rgba(248,113,113,0.2); }
        .delete-btn.disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== 附件标签 ===== */
        .attach-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        .attach-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.6rem;
            padding: 1px 8px 1px 5px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.06);
            line-height: 1.6;
        }
        .attach-tag img {
            width: 16px;
            height: 16px;
            object-fit: contain;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .attach-tag .tag-icon { font-size: 0.7rem; }
        .attach-tag.tag-candy { border-color: #f59e0b33; color: #fbbf24; }
        .attach-tag.tag-rainbow { border-color: #ec489933; color: #f472b6; }
        .attach-tag.tag-syrup { border-color: #8b5cf633; color: #c4b5fd; }
        .attach-tag.tag-title { border-color: #8b5cf633; color: #a78bfa; }
        .attach-tag.tag-frame { border-color: #06b6d433; color: #22d3ee; }
        .attach-tag.tag-item { border-color: #f59e0b33; color: #fbbf24; }

        /* ===== 详情面板 & 模态框附件 ===== */
        .detail-panel {
            background: #1e293b;
            border-radius: 28px;
            padding: 20px;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 8px;
        }
        .detail-title { font-size: 1.3rem; font-weight: bold; word-break: break-word; }
        .detail-date { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; }
        .detail-from { font-size: 0.75rem; color: #94a3b8; margin-bottom: 12px; }
        .detail-content {
            white-space: pre-wrap;
            margin: 16px 0;
            line-height: 1.5;
            word-break: break-word;
        }
        .detail-attach,
        #modalAttach {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            margin: 12px 0;
        }
        .attach-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 8px;
            transition: background 0.2s;
            overflow: hidden;
        }
        .attach-item:hover { background: rgba(255,255,255,0.04); }

        .detail-attach .attach-item img,
        #modalAttach .attach-item img {
            width: 28px !important;
            height: 28px !important;
            max-width: 28px !important;
            max-height: 28px !important;
            object-fit: contain;
            border-radius: 4px;
            flex-shrink: 0;
            display: block;
        }

        .attach-item .attach-icon {
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .attach-item .attach-name { font-size: 0.85rem; color: #e2e8f0; flex: 1; min-width: 0; word-break: break-word; }
        .attach-item .attach-amount {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-left: auto;
            flex-shrink: 0;
        }

        .detail-claim-btn {
            background: #f59e0b;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 12px;
            transition: opacity 0.2s;
            min-height: 48px;
        }
        .detail-claim-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .empty-tip {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        /* ===== 页头 ===== */
        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .title-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .unread-badge {
            background: #f87171;
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 8px;
        }
        .delete-all-btn {
            background: #f87171;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
            min-height: 40px;
        }
        .delete-all-btn:active { opacity: 0.8; }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
        }
        body.embedded .back-link { display: none !important; }

        .email-close-btn {
            display: none;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 0 6px;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-weight: 300;
            line-height: 1;
            flex-shrink: 0;
        }
        .email-close-btn:hover {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            transform: rotate(90deg);
        }
        body.embedded .email-close-btn { display: inline-flex !important; }

        .mail-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #3b4b6e;
            border-radius: 40px;
            padding: 10px 16px;
            color: white;
            font-size: 16px; /* ★ 防止 iOS 聚焦放大 */
            outline: none;
            min-height: 44px;
        }
        .search-input:focus { border-color: #facc15; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #1e293b;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            color: #cbd5e1;
            cursor: pointer;
            min-height: 36px;
            font-size: 0.9rem;
        }
        .page-btn.active {
            background: #f59e0b;
            color: #1e293b;
            font-weight: bold;
        }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .retry-btn {
            background: #f59e0b;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 12px;
            min-height: 40px;
        }

        /* ===== 模态框通用 ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #1e293b;
            max-width: 550px;
            width: 100%;
            border-radius: 28px;
            padding: 24px;
            max-height: 85vh;
            max-height: 85dvh;
            overflow-y: auto;
            position: relative;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .close-modal,
        .detail-panel-close {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #cbd5e1;
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            line-height: 1;
            flex-shrink: 0;
        }
        .close-modal:hover,
        .detail-panel-close:hover {
            background: rgba(248, 113, 113, 0.3);
            color: #f87171;
            transform: scale(1.05);
        }

        /* ===== 奖励弹窗 ===== */
        .reward-modal .modal-content {
            text-align: center;
            max-width: 320px;
            padding: 24px 20px;
        }
        .reward-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #facc15;
        }
        .reward-icon-container {
            position: relative;
            display: inline-block;
            margin: 10px auto;
            cursor: pointer;
            padding: 8px;
            border-radius: 16px;
            background: rgba(255,255,255,0.04);
            transition: background 0.2s;
        }
        .reward-icon-container:hover { background: rgba(255,255,255,0.08); }
        .reward-icon-container .reward-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            border-radius: 12px;
        }
        .reward-icon-container .reward-icon-fa {
            font-size: 4.5rem;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #facc15;
            background: rgba(250, 204, 21, 0.08);
            border-radius: 16px;
        }
        .reward-count-badge {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: #f59e0b;
            color: #1e293b;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 2px 12px;
            border-radius: 40px;
            border: 2px solid #1e293b;
            min-width: 30px;
        }
        .reward-name-label {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-top: 8px;
            font-weight: 500;
        }
        .reward-confirm {
            background: #f59e0b;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 80%;
            margin-top: 20px;
            transition: transform 0.15s;
            min-height: 44px;
        }
        .reward-confirm:hover { transform: scale(1.02); }
        .reward-confirm:active { transform: scale(0.96); }

        /* ===== 物品详情弹窗 ===== */
        .item-detail-modal .modal-content {
            max-width: 280px;
            text-align: center;
            padding: 24px 20px;
        }
        .item-detail-modal .detail-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 16px;
            background: rgba(255,255,255,0.04);
            padding: 8px;
        }
        .item-detail-modal .detail-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #facc15;
            margin-top: 8px;
        }
        .item-detail-modal .detail-owned {
            font-size: 1rem;
            color: #cbd5e1;
            margin-top: 4px;
        }
        .item-detail-modal .detail-close {
            background: #f59e0b;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            min-height: 44px;
        }

        /* ===== 信息弹窗 ===== */
        .info-modal .modal-content {
            max-width: 280px;
            text-align: center;
            padding: 24px 20px;
        }
        .info-icon { font-size: 3rem; margin-bottom: 12px; }
        .info-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #facc15;
        }
        .info-desc {
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 12px 0;
            color: #cbd5e1;
        }
        .info-close {
            background: #f59e0b;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            min-height: 44px;
        }

        /* ===== 确认弹窗 ===== */
        .confirm-modal .modal-content {
            max-width: 300px;
            text-align: center;
        }
        .confirm-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        .confirm-btn {
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
            flex: 1;
        }
        .confirm-btn.cancel { background: #475569; color: white; }
        .confirm-btn.confirm { background: #f87171; color: white; }
        .error-tip {
            color: #f87171;
            text-align: center;
            padding: 20px;
        }

        /* ===== 顶部 Toast 通知（替代 alert） ===== */
        #toast {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translate(-50%, -20px);
            background: #1e293b;
            color: #eef2ff;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 10001;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #3b4b6e;
            opacity: 0;
            visibility: hidden;
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0s linear 0.3s;
            max-width: calc(100vw - 40px);
            text-align: center;
            word-break: break-word;
        }
        #toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
            visibility: visible;
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0s;
        }
        #toast.success { background: #0d2818; border-color: #3ecf8e; color: #a8e6c0; }
        #toast.error { background: #2a0f0f; border-color: #f87171; color: #fca5a5; }
        #toast.warning { background: #1f1a0a; border-color: #fbbf24; color: #fcd34d; }

        /* ===== 嵌入模式微调 ===== */
        body.embedded .mail-item { background: rgba(30, 41, 59, 0.6); }
        body.embedded .mail-item.selected { background: rgba(42, 63, 94, 0.8); }
        body.embedded .mail-item.unread { background: rgba(42, 63, 94, 0.7); }
        body.embedded .detail-panel { background: rgba(30, 41, 59, 0.6); }
        body.embedded .mail-detail-section { background: rgba(30, 41, 59, 0.6); }
        body.embedded .search-input { background: rgba(30, 41, 59, 0.7); }
        body.embedded .modal-content { background: #1a2639; }
        body.embedded .detail-attach { background: rgba(15, 23, 42, 0.7); }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #3b4b6e; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a6b8e; }

        /* ============================================================
           ★★★ 手机端适配 ★★★
           ============================================================ */
        @media (max-width: 767px) {
            body {
                padding: 12px;
                padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            }
            body.embedded { padding: 4px 8px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }

            h2 {
                font-size: 1.25rem;
                margin-bottom: 12px;
                gap: 8px;
            }
            .title-left { gap: 8px; }
            .delete-all-btn { padding: 8px 12px; font-size: 0.8rem; }

            .mail-item { padding: 14px 12px; border-radius: 12px; }
            .mail-title { font-size: 0.95rem; gap: 6px; }
            .mail-meta { font-size: 0.65rem; }
            .mail-header { gap: 8px; }
            .mail-actions { gap: 4px; }

            .claim-btn {
                padding: 8px 14px;
                font-size: 0.82rem;
                min-height: 40px;
            }
            .delete-btn { width: 44px; height: 44px; font-size: 1.3rem; }

            .attach-tag {
                font-size: 0.65rem;
                padding: 2px 10px 2px 6px;
            }
            .attach-tag img { width: 18px; height: 18px; }

            /* ★ 详情模态框 → 底部抽屉 */
            .modal:not(.reward-modal):not(.item-detail-modal):not(.info-modal):not(.confirm-modal) {
                align-items: flex-end;
                padding: 0;
            }
            .modal:not(.reward-modal):not(.item-detail-modal):not(.info-modal):not(.confirm-modal) .modal-content {
                width: 100%;
                max-width: 100%;
                border-radius: 20px 20px 0 0;
                max-height: 92dvh;
                padding: 20px 16px;
                padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            }

            /* 奖励/物品/信息/确认弹窗保持居中，但尺寸收紧 */
            .modal.reward-modal .modal-content,
            .modal.item-detail-modal .modal-content,
            .modal.info-modal .modal-content,
            .modal.confirm-modal .modal-content {
                max-width: 92%;
                width: 92%;
                border-radius: 22px;
                padding: 20px 16px;
            }

            .detail-claim-btn {
                font-size: 0.95rem;
                min-height: 48px;
                padding: 12px 16px;
            }

            .attach-item { gap: 8px; padding: 6px; }
            .attach-item .attach-name { font-size: 0.82rem; }
            .attach-item .attach-amount { font-size: 0.7rem; }

            /* 奖励弹窗图标稍小 */
            .reward-icon-container .reward-img,
            .reward-icon-container .reward-icon-fa {
                width: 84px;
                height: 84px;
                font-size: 3.6rem;
            }

<script>
    // ============================================================
    //  常量 & 缓存
    // ============================================================
    const SUPABASE_URL = 'https://ysmijycsyzpjoieaknmb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzbWlqeWNzeXpwam9pZWFrbm1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNDgzNjMsImV4cCI6MjA4MjgyNDM2M30.H7dx2k_0099LVXprMrghHOFh16OoSSgtCUOib2otHPA';

    const ASSETS = {
        candy:   'https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/items/props/Crushed_sugar.webp',
        rainbow: 'https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/items/props/Super_Sweet.webp',
        syrup:   'https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/items/props/Dream_galaxy_syrup.webp'
    };

    // ★ 本地唯一道具/隐藏奖杯配置表（前端静态定义，不用拉数据库）
    const ITEM_CONFIG = {
        'trophy_1st_hidden': {
            name: '一周年·隐藏纪念杯',
            icon: 'fa-solid fa-trophy',
            isImg: false
        }
    };

    let titleCache = new Map();
    let frameCache = new Map();

    // ============================================================
    //  工具函数
    // ============================================================
    function getAuthSession() {
        const sessionStr = localStorage.getItem('sb-ysmijycsyzpjoieaknmb-auth-token');
        if (!sessionStr) return null;
        try { return JSON.parse(sessionStr); } catch { return null; }
    }

    function getAuthToken() {
        const s = getAuthSession();
        return s?.access_token || null;
    }

    function formatNumber(n) {
        if (n === undefined || n === null) return '0';
        return Number(n).toLocaleString();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function formatDate(isoString) {
        if (!isoString) return '';
        return new Date(isoString).toLocaleString();
    }

    // ★ Toast 替代 alert
    let toastTimer = null;
    function showNotification(msg, type = 'info') {
        let el = document.getElementById('toast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'toast';
            document.body.appendChild(el);
        }
        if (toastTimer) clearTimeout(toastTimer);
        el.className = '';
        el.textContent = msg;
        void el.offsetWidth;
        el.classList.add(type, 'show');
        toastTimer = setTimeout(() => {
            el.classList.remove('show');
        }, 4000);
    }

    function getSenderDisplay(mail) {
        if (mail.sender_name) return mail.sender_name;
        const senderId = mail.created_by_admin;
        if (!senderId) return '系统';
        return userNamesMap.get(senderId) || '未知用户';
    }

    function isDeletable(mail) {
        const items = mail.claimable_items || [];
        const hasUnclaimed = items.length > 0 && !mail.claimed_at;
        return !hasUnclaimed;
    }

    // ============================================================
    //  缓存查询
    // ============================================================
    async function fetchTitleName(titleId) {
        if (titleCache.has(titleId)) return titleCache.get(titleId);
        const token = getAuthToken();
        if (!token) return `称号 #${titleId}`;
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/titles?id=eq.${titleId}&select=name`,
                { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } }
            );
            if (!res.ok) throw new Error('称号查询失败');
            const data = await res.json();
            const name = data[0]?.name || `称号 #${titleId}`;
            titleCache.set(titleId, name);
            return name;
        } catch {
            return `称号 #${titleId}`;
        }
    }

    async function fetchFrameConfig(frameId) {
        if (frameCache.has(frameId)) return frameCache.get(frameId);
        const token = getAuthToken();
        if (!token) return { name: frameId, image_url: '' };
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/shop_frames?id=eq.${frameId}&select=name,image_url`,
                { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } }
            );
            if (!res.ok) throw new Error('头像框查询失败');
            const data = await res.json();
            const config = data[0] || { name: frameId, image_url: '' };
            frameCache.set(frameId, config);
            return config;
        } catch {
            return { name: frameId, image_url: '' };
        }
    }

    // ============================================================
    //  ★ 附件显示信息（支持 item / syrup / active / chest）
    // ============================================================
    async function getAttachDisplay(item) {
        if (item.type === 'candy') {
            return {
                icon: ASSETS.candy, isImg: true,
                label: '🍬 糖果碎',
                suffix: `×${Number(item.amount).toLocaleString()}`
            };
        } else if (item.type === 'rainbow') {
            return {
                icon: ASSETS.rainbow, isImg: true,
                label: '🌈 超级棒糖',
                suffix: `×${Number(item.amount).toLocaleString()}`
            };
        } else if (item.type === 'syrup') {
            return {
                icon: ASSETS.syrup, isImg: true,
                label: '🌌 星河糖浆',
                suffix: `×${Number(item.amount).toLocaleString()}`
            };
        } else if (item.type === 'active') {
            return {
                icon: 'fa-solid fa-bolt', isImg: false,
                label: '⚡ 活跃度',
                suffix: `×${Number(item.amount).toLocaleString()}`
            };
        } else if (item.type === 'chest') {
            return {
                icon: 'fa-solid fa-box-open', isImg: false,
                label: '🎁 神秘宝箱',
                suffix: `×${Number(item.amount).toLocaleString()}`
            };
        } else if (item.type === 'title') {
            const name = await fetchTitleName(item.title_id);
            return {
                icon: 'fa-solid fa-medal', isImg: false,
                label: `🏅 ${name}`,
                suffix: `ID:${item.title_id}`
            };
        } else if (item.type === 'frame') {
            const config = await fetchFrameConfig(item.frame_id);
            return {
                icon: config.image_url || 'fa-solid fa-image',
                isImg: !!config.image_url,
                label: `🖼️ ${config.name || item.frame_id}`,
                suffix: ''
            };
        } else if (item.type === 'item') {
            // ★ 唯一道具/隐藏奖杯
            const cfg = ITEM_CONFIG[item.item_id] || { name: item.item_id, icon: 'fa-solid fa-gift', isImg: false };
            return {
                icon: cfg.icon,
                isImg: cfg.isImg,
                label: `🏆 ${cfg.name}`,
                suffix: ''
            };
        }
        return {
            icon: 'fa-solid fa-gift', isImg: false,
            label: '🎁 神秘物品',
            suffix: ''
        };
    }

    // ============================================================
    //  全局状态
    // ============================================================
    let currentMails = [];
    let filteredMails = [];
    let currentUserId = null;
    let pendingDeleteAction = null;
    let currentSelectedMail = null;
    let userNamesMap = new Map();
    // ★ 扩展为全货币
    let currentUserStats = {
        candy_crumbles: 0,
        rainbow_lollipops: 0,
        dreamy_syrup: 0,
        active_points: 0,
        chest_count: 0
    };
    let currentPage = 1;
    const PAGE_SIZE = 15;
    let searchKeyword = '';
    let loadingError = false;

    // ============================================================
    //  未读角标
    // ============================================================
    function updateUnreadBadge() {
        const unreadCount = currentMails.filter(m => !m.read_at).length;
        const badge = document.getElementById('unreadBadge');
        if (unreadCount > 0) {
            badge.textContent = unreadCount;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
        document.title = unreadCount > 0 ? `(${unreadCount}) 我的邮箱 - 六哥荣耀` : '我的邮箱 - 六哥荣耀';
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'refreshEmailBadge' }, '*');
        }
    }

    // ============================================================
    //  筛选 & 分页
    // ============================================================
    function applyFilter() {
        if (!searchKeyword.trim()) {
            filteredMails = [...currentMails];
        } else {
            const kw = searchKeyword.trim().toLowerCase();
            filteredMails = currentMails.filter(m =>
                m.title.toLowerCase().includes(kw) ||
                (m.content && m.content.toLowerCase().includes(kw))
            );
        }
        currentPage = 1;
        renderMailList();
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredMails.length / PAGE_SIZE);
        const container = document.getElementById('pagination');
        if (!container || totalPages <= 1) {
            container.innerHTML = '';
            return;
        }
        let html = '';
        html += `<button class="page-btn" data-page="${currentPage-1}" ${currentPage===1 ? 'disabled' : ''}>‹</button>`;
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="page-btn ${i===currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }
        html += `<button class="page-btn" data-page="${currentPage+1}" ${currentPage===totalPages ? 'disabled' : ''}>›</button>`;
        container.innerHTML = html;
        document.querySelectorAll('.page-btn').forEach(btn => {
            const page = parseInt(btn.dataset.page);
            if (!isNaN(page)) {
                btn.addEventListener('click', () => {
                    if (page < 1 || page > totalPages) return;
                    currentPage = page;
                    renderMailList();
                    renderPagination();
                });
            }
        });
    }

    // ============================================================
    //  渲染邮件列表
    // ============================================================
    async function renderMailList() {
        const container = document.getElementById('mailList');
        if (!container) return;
        if (filteredMails.length === 0) {
            container.innerHTML = '<div class="empty-tip">📭 暂无邮件</div>';
            return;
        }
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageMails = filteredMails.slice(start, start + PAGE_SIZE);

        let html = '';
        for (const mail of pageMails) {
            const hasAttach = (mail.claimable_items && mail.claimable_items.length > 0);
            const isClaimed = !!mail.claimed_at;
            const unreadClass = !mail.read_at ? 'unread' : '';
            const selectedClass = (currentSelectedMail && currentSelectedMail.id === mail.id) ? 'selected' : '';
            const sender = escapeHtml(getSenderDisplay(mail));
            const tagContainerId = `tags-${mail.id}`;
            html += `
                <div class="mail-item ${unreadClass} ${selectedClass}" data-id="${mail.id}">
                    <div class="mail-header">
                        <div>
                            <div class="mail-title">
                                ${escapeHtml(mail.title)}
                                <span class="attach-tags" id="${tagContainerId}"></span>
                            </div>
                            <div class="mail-meta">来自：${sender} · ${formatDate(mail.created_at)}</div>
                        </div>
                        <div class="mail-actions">
                            ${hasAttach && !isClaimed ? `<button class="claim-btn" data-id="${mail.id}">🎁 领取</button>` : (isClaimed ? '<span class="claimed-badge">✅ 已领取</span>' : '')}
                            <button class="delete-btn" data-id="${mail.id}" title="删除邮件">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;

        // 异步填充附件标签
        for (const mail of pageMails) {
            const tagContainer = document.getElementById(`tags-${mail.id}`);
            if (!tagContainer) continue;
            if (!mail.claimable_items || mail.claimable_items.length === 0) {
                tagContainer.innerHTML = '';
                continue;
            }
            let tagsHtml = '';
            const items = mail.claimable_items;
            const types = new Set(items.map(i => i.type));
            for (const type of types) {
                if (type === 'candy') {
                    tagsHtml += `<span class="attach-tag tag-candy"><img src="${ASSETS.candy}" alt="🍬">糖果碎</span>`;
                } else if (type === 'rainbow') {
                    tagsHtml += `<span class="attach-tag tag-rainbow"><img src="${ASSETS.rainbow}" alt="🌈">超级棒糖</span>`;
                } else if (type === 'syrup') {
                    tagsHtml += `<span class="attach-tag tag-syrup"><img src="${ASSETS.syrup}" alt="🌌">星河糖浆</span>`;
                } else if (type === 'active') {
                    tagsHtml += `<span class="attach-tag tag-rainbow"><i class="fa-solid fa-bolt tag-icon"></i>活跃度</span>`;
                } else if (type === 'chest') {
                    tagsHtml += `<span class="attach-tag tag-item"><i class="fa-solid fa-box-open tag-icon"></i>宝箱</span>`;
                } else if (type === 'title') {
                    const titleItem = items.find(i => i.type === 'title');
                    const name = await fetchTitleName(titleItem.title_id);
                    tagsHtml += `<span class="attach-tag tag-title"><i class="fa-solid fa-medal tag-icon"></i>${name}</span>`;
                } else if (type === 'frame') {
                    const frameItem = items.find(i => i.type === 'frame');
                    const config = await fetchFrameConfig(frameItem.frame_id);
                    tagsHtml += `<span class="attach-tag tag-frame"><i class="fa-solid fa-image tag-icon"></i>${config.name || frameItem.frame_id}</span>`;
                } else if (type === 'item') {
                    const itemItem = items.find(i => i.type === 'item');
                    const cfg = ITEM_CONFIG[itemItem.item_id] || { name: itemItem.item_id };
                    tagsHtml += `<span class="attach-tag tag-item"><i class="fa-solid fa-trophy tag-icon"></i>${cfg.name}</span>`;
                }
            }
            tagContainer.innerHTML = tagsHtml;
        }

        bindMailItemEvents();
    }

    function bindMailItemEvents() {
        document.querySelectorAll('.claim-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const mailId = parseInt(btn.dataset.id);
                await claimMail(mailId);
            });
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const mailId = parseInt(btn.dataset.id);
                const mail = currentMails.find(m => m.id === mailId);
                if (!mail) return;
                if (!isDeletable(mail)) {
                    showNotification('该邮件有未领取的附件，请先领取后再删除', 'warning');
                    return;
                }
                showConfirm('确定要删除这封邮件吗？', async () => {
                    await deleteMail(mailId);
                    closeConfirmModal();
                    if (currentSelectedMail && currentSelectedMail.id === mailId) {
                        renderDetailPanel(null);
                        currentSelectedMail = null;
                    }
                });
            });
        });
        document.querySelectorAll('.mail-item').forEach(el => {
            el.addEventListener('click', async (e) => {
                if (e.target.classList.contains('claim-btn') || e.target.classList.contains('delete-btn')) return;
                const id = parseInt(el.dataset.id);
                const mail = currentMails.find(m => m.id === id);
                if (!mail) return;
                document.querySelectorAll('.mail-item').forEach(item => item.classList.remove('selected'));
                el.classList.add('selected');
                currentSelectedMail = mail;
                if (!mail.read_at) {
                    await markAsRead(mail.id);
                    mail.read_at = new Date().toISOString();
                    updateUnreadBadge();
                    renderMailList();
                }
                if (window.innerWidth >= 768 && window.matchMedia("(orientation: landscape)").matches) {
                    renderDetailPanel(mail);
                } else {
                    openDetailModal(mail);
                }
            });
        });
    }

    // ============================================================
    //  API 操作
    // ============================================================
    async function markAsRead(mailId) {
        const token = getAuthToken();
        if (!token) return;
        await fetch(`${SUPABASE_URL}/rest/v1/user_mails?id=eq.${mailId}`, {
            method: 'PATCH',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ read_at: new Date().toISOString() })
        });
    }

    async function deleteMail(mailId) {
        const session = getAuthSession();
        if (!session) throw new Error('未登录');
        const token = session.access_token;
        const userId = session.user.id;
        const response = await fetch(`${SUPABASE_URL}/rest/v1/user_mails?id=eq.${mailId}&to_user_id=eq.${userId}`, {
            method: 'DELETE',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('删除失败');
        currentMails = currentMails.filter(m => m.id !== mailId);
        applyFilter();
        if (currentSelectedMail && currentSelectedMail.id === mailId) {
            renderDetailPanel(null);
            currentSelectedMail = null;
        }
        updateUnreadBadge();
        showNotification('邮件已删除', 'success');
    }

    async function deleteAllMails() {
        const session = getAuthSession();
        if (!session) throw new Error('未登录');
        const token = session.access_token;
        const userId = session.user.id;
        const deletableIds = currentMails.filter(mail => {
            const hasUnclaimed = (mail.claimable_items?.length > 0 && !mail.claimed_at);
            return mail.read_at && !hasUnclaimed;
        }).map(mail => mail.id);
        if (deletableIds.length === 0) {
            showNotification('没有可删除的邮件（只有已读且无未领取附件的邮件才能批量删除）', 'info');
            return;
        }
        const idsParam = deletableIds.join(',');
        const response = await fetch(`${SUPABASE_URL}/rest/v1/user_mails?id=in.(${idsParam})&to_user_id=eq.${userId}`, {
            method: 'DELETE',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('批量删除失败');
        currentMails = currentMails.filter(m => !deletableIds.includes(m.id));
        applyFilter();
        if (currentSelectedMail && deletableIds.includes(currentSelectedMail.id)) {
            renderDetailPanel(null);
            currentSelectedMail = null;
        }
        updateUnreadBadge();
        showNotification(`已删除 ${deletableIds.length} 封邮件`, 'success');
    }

    // ============================================================
    //  授予称号 / 头像框 / 唯一道具
    // ============================================================
    async function _grantTitle(userId, titleId, token) {
        const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/user_titles?user_id=eq.${userId}&title_id=eq.${titleId}`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
        });
        const existing = await checkRes.json();
        if (existing.length === 0) {
            await fetch(`${SUPABASE_URL}/rest/v1/user_titles`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, title_id: titleId })
            });
            return false;
        }
        return true;
    }

    async function _grantFrame(userId, frameId, token) {
        const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${userId}&select=owned_frames`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
        });
        const profiles = await profileRes.json();
        let ownedFrames = profiles[0]?.owned_frames || ['nature'];
        if (!ownedFrames.includes(frameId)) {
            ownedFrames.push(frameId);
            const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${userId}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ owned_frames: ownedFrames })
            });
            if (!patchRes.ok) throw new Error('头像框添加失败');
            return false;
        }
        return true;
    }

    // ★ 新增：授予唯一道具（隐藏奖杯）
    async function _grantItem(userId, itemId, token) {
        const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${userId}&select=owned_items`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
        });
        const profiles = await profileRes.json();
        let ownedItems = profiles[0]?.owned_items || [];
        if (!ownedItems.includes(itemId)) {
            ownedItems.push(itemId);
            const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${userId}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ owned_items: ownedItems })
            });
            if (!patchRes.ok) throw new Error('道具添加失败');
            return false;
        }
        return true;
    }

    // ============================================================
    //  ★★★ 领取邮件（支持全部奖励类型） ★★★
    // ============================================================
    async function claimMail(mailId) {
        const claimBtn = document.querySelector(`.claim-btn[data-id="${mailId}"]`);
        const panelClaimBtn = document.getElementById('panelClaimBtn');
        const modalClaimBtn = document.getElementById('modalClaimBtn');

        // ★ 修复：不再把箭头函数赋给 innerText
        const setButtonsLoading = (loading, isClaimed) => {
            if (claimBtn) claimBtn.disabled = loading;
            if (panelClaimBtn) {
                panelClaimBtn.disabled = loading;
                if (!loading) panelClaimBtn.innerText = isClaimed ? '已领取' : '领取附件';
                else panelClaimBtn.innerText = '领取中...';
            }
            if (modalClaimBtn) {
                modalClaimBtn.disabled = loading;
                if (!loading) modalClaimBtn.innerText = isClaimed ? '已领取' : '领取附件';
                else modalClaimBtn.innerText = '领取中...';
            }
        };

        try {
            const session = getAuthSession();
            if (!session) throw new Error('未登录');
            const token = session.access_token;
            const userId = session.user.id;

            const res = await fetch(`${SUPABASE_URL}/rest/v1/user_mails?id=eq.${mailId}&to_user_id=eq.${userId}&select=*`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
            });
            const mails = await res.json();
            const mail = mails[0];
            if (!mail) throw new Error('邮件不存在');
            if (mail.claimed_at) throw new Error('已经领取过了');
            const items = mail.claimable_items || [];
            if (items.length === 0) throw new Error('该邮件没有附件');

            setButtonsLoading(true, false);

            // 原子性标记已领取
            const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/user_mails?id=eq.${mailId}&claimed_at=is.null`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=headers'
                },
                body: JSON.stringify({ claimed_at: new Date().toISOString() })
            });
            if (!patchRes.ok) throw new Error('领取失败，可能已被抢先领取');

            // --- 处理奖励 ---
            let candyDelta = 0, rainbowDelta = 0, syrupDelta = 0, activeDelta = 0, chestDelta = 0;
            let rewardType = 'other';
            let rewardIcon = 'fa-solid fa-gift';
            let rewardIsImg = false;
            let rewardAmount = 0;
            let rewardName = '🎁 神秘物品';
            let extraInfo = '';
            let detailImage = '';
            let detailName = '';
            let detailOwned = 0;
            // ★ 优先展示非货币奖励
            let hasNonCurrencyReward = false;

            for (const item of items) {
                if (item.type === 'candy') {
                    candyDelta += item.amount;
                    if (!hasNonCurrencyReward) {
                        rewardType = 'candy';
                        rewardIcon = ASSETS.candy;
                        rewardIsImg = true;
                        rewardName = '🍬 糖果碎';
                        detailImage = rewardIcon;
                        detailName = '糖果碎';
                        detailOwned = (currentUserStats.candy_crumbles || 0) + candyDelta;
                    }
                } else if (item.type === 'rainbow') {
                    rainbowDelta += item.amount;
                    if (!hasNonCurrencyReward) {
                        rewardType = 'rainbow';
                        rewardIcon = ASSETS.rainbow;
                        rewardIsImg = true;
                        rewardName = '🌈 超级棒糖';
                        detailImage = rewardIcon;
                        detailName = '超级棒糖';
                        detailOwned = (currentUserStats.rainbow_lollipops || 0) + rainbowDelta;
                    }
                } else if (item.type === 'syrup') {
                    syrupDelta += item.amount;
                    if (!hasNonCurrencyReward) {
                        rewardType = 'syrup';
                        rewardIcon = ASSETS.syrup;
                        rewardIsImg = true;
                        rewardName = '🌌 星河糖浆';
                        detailImage = rewardIcon;
                        detailName = '星河糖浆';
                        detailOwned = (currentUserStats.dreamy_syrup || 0) + syrupDelta;
                    }
                } else if (item.type === 'active') {
                    activeDelta += item.amount;
                    if (!hasNonCurrencyReward) {
                        rewardType = 'active';
                        rewardIcon = 'fa-solid fa-bolt';
                        rewardIsImg = false;
                        rewardName = '⚡ 活跃度';
                        detailImage = rewardIcon;
                        detailName = '活跃度';
                        detailOwned = (currentUserStats.active_points || 0) + activeDelta;
                    }
                } else if (item.type === 'chest') {
                    chestDelta += item.amount;
                    if (!hasNonCurrencyReward) {
                        rewardType = 'chest';
                        rewardIcon = 'fa-solid fa-box-open';
                        rewardIsImg = false;
                        rewardName = '🎁 神秘宝箱';
                        detailImage = rewardIcon;
                        detailName = '神秘宝箱';
                        detailOwned = (currentUserStats.chest_count || 0) + chestDelta;
                    }
                } else if (item.type === 'title') {
                    const titleName = await fetchTitleName(item.title_id);
                    const alreadyOwned = await _grantTitle(userId, item.title_id, token);
                    if (alreadyOwned) {
                        rainbowDelta += 100;
                        extraInfo = `⚠️ 已拥有该称号，自动补偿 100 🌈`;
                        if (!hasNonCurrencyReward) {
                            rewardType = 'rainbow';
                            rewardIcon = ASSETS.rainbow;
                            rewardIsImg = true;
                            rewardName = `🌈 超级棒糖 (补偿)`;
                            detailImage = rewardIcon;
                            detailName = '超级棒糖 (补偿)';
                            detailOwned = (currentUserStats.rainbow_lollipops || 0) + rainbowDelta;
                        }
                    } else {
                        hasNonCurrencyReward = true;
                        rewardType = 'title';
                        rewardIcon = 'fa-solid fa-medal';
                        rewardIsImg = false;
                        rewardName = `🏅 ${titleName}`;
                        detailImage = rewardIcon;
                        detailName = titleName;
                        detailOwned = 1;
                        extraInfo = '🎉 获得新称号！';
                    }
                } else if (item.type === 'frame') {
                    const config = await fetchFrameConfig(item.frame_id);
                    const alreadyOwned = await _grantFrame(userId, item.frame_id, token);
                    if (alreadyOwned) {
                        rainbowDelta += 1000;
                        extraInfo = `⚠️ 已拥有该头像框，自动补偿 1,000 🌈`;
                        if (!hasNonCurrencyReward) {
                            rewardType = 'rainbow';
                            rewardIcon = ASSETS.rainbow;
                            rewardIsImg = true;
                            rewardName = `🌈 超级棒糖 (补偿)`;
                            detailImage = rewardIcon;
                            detailName = '超级棒糖 (补偿)';
                            detailOwned = (currentUserStats.rainbow_lollipops || 0) + rainbowDelta;
                        }
                    } else {
                        hasNonCurrencyReward = true;
                        rewardType = 'frame';
                        rewardIcon = config.image_url || 'fa-solid fa-image';
                        rewardIsImg = !!config.image_url;
                        rewardName = `🖼️ ${config.name || item.frame_id}`;
                        detailImage = rewardIcon;
                        detailName = config.name || item.frame_id;
                        detailOwned = 1;
                        extraInfo = '🎉 获得新头像框！';
                    }
                } else if (item.type === 'item') {
                    // ★ 唯一道具/隐藏奖杯
                    const cfg = ITEM_CONFIG[item.item_id] || { name: item.item_id, icon: 'fa-solid fa-gift', isImg: false };
                    const alreadyOwned = await _grantItem(userId, item.item_id, token);
                    if (alreadyOwned) {
                        rainbowDelta += 1000;
                        extraInfo = `⚠️ 已拥有该纪念品，自动补偿 1,000 🌈`;
                        if (!hasNonCurrencyReward) {
                            rewardType = 'rainbow';
                            rewardIcon = ASSETS.rainbow;
                            rewardIsImg = true;
                            rewardName = `🌈 超级棒糖 (补偿)`;
                            detailImage = rewardIcon;
                            detailName = '超级棒糖 (补偿)';
                            detailOwned = (currentUserStats.rainbow_lollipops || 0) + rainbowDelta;
                        }
                    } else {
                        hasNonCurrencyReward = true;
                        rewardType = 'item';
                        rewardIcon = cfg.icon;
                        rewardIsImg = cfg.isImg;
                        rewardName = `🏆 ${cfg.name}`;
                        detailImage = rewardIcon;
                        detailName = cfg.name;
                        detailOwned = 1;
                        extraInfo = '🎉 获得绝版隐藏奖杯！';
                    }
                }
            }

            // 统一更新 user_stats（PATCH，不用 PUT 覆盖整行）
            if (candyDelta || rainbowDelta || syrupDelta || activeDelta || chestDelta) {
                const patchBody = {};
                if (candyDelta) {
                    currentUserStats.candy_crumbles = (currentUserStats.candy_crumbles || 0) + candyDelta;
                    patchBody.candy_crumbles = currentUserStats.candy_crumbles;
                }
                if (rainbowDelta) {
                    currentUserStats.rainbow_lollipops = (currentUserStats.rainbow_lollipops || 0) + rainbowDelta;
                    patchBody.rainbow_lollipops = currentUserStats.rainbow_lollipops;
                }
                if (syrupDelta) {
                    currentUserStats.dreamy_syrup = (currentUserStats.dreamy_syrup || 0) + syrupDelta;
                    patchBody.dreamy_syrup = currentUserStats.dreamy_syrup;
                }
                if (activeDelta) {
                    currentUserStats.active_points = (currentUserStats.active_points || 0) + activeDelta;
                    patchBody.active_points = currentUserStats.active_points;
                }
                if (chestDelta) {
                    currentUserStats.chest_count = (currentUserStats.chest_count || 0) + chestDelta;
                    patchBody.chest_count = currentUserStats.chest_count;
                }
                await fetch(`${SUPABASE_URL}/rest/v1/user_stats?user_id=eq.${userId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(patchBody)
                });
                // 更新详情拥有数量
                if (rewardType === 'candy') detailOwned = currentUserStats.candy_crumbles;
                else if (rewardType === 'rainbow') detailOwned = currentUserStats.rainbow_lollipops;
                else if (rewardType === 'syrup') detailOwned = currentUserStats.dreamy_syrup;
                else if (rewardType === 'active') detailOwned = currentUserStats.active_points;
                else if (rewardType === 'chest') detailOwned = currentUserStats.chest_count;
            }

            const targetMail = currentMails.find(m => m.id === mailId);
            if (targetMail) targetMail.claimed_at = new Date().toISOString();
            applyFilter();
            if (currentSelectedMail && currentSelectedMail.id === mailId) {
                currentSelectedMail.claimed_at = targetMail.claimed_at;
                renderDetailPanel(currentSelectedMail);
            }
            setButtonsLoading(false, true);

            showRewardModal({
                icon: rewardIcon,
                isImg: rewardIsImg,
                amount: rewardAmount,
                name: rewardName,
                type: rewardType,
                extraInfo: extraInfo,
                detailImage: detailImage,
                detailName: detailName,
                detailOwned: detailOwned
            });

        } catch (err) {
            setButtonsLoading(false, false);
            showNotification('领取失败：' + err.message, 'error');
        }
    }

        const modal = document.getElementById('rewardModal');

        const nameLabel = document.getElementById('rewardNameLabel');
        const extraDiv = document.getElementById('rewardExtraInfo');

        container.innerHTML = '';

            img.src = info.icon;
            img.alt = info.name;
            img.draggable = false;
            container.appendChild(img);
        } else {
            const i = document.createElement('i');
            i.className = info.icon + ' reward-icon-fa';
            container.appendChild(i);
        }
        container.style.cursor = 'pointer';

        // 数量角标（货币类才显示）
        if (info.amount > 0) {
            const badge = document.createElement('span');

            container.appendChild(badge);

            image: info.detailImage || info.icon,

            owned: info.detailOwned || 0,
            isImg: info.isImg
        };

        container.onclick = function() {
            if (currentRewardDetail) openItemDetailModal(currentRewardDetail);

        modal.classList.add('show');

        document.getElementById('rewardModal').classList.remove('show');

    async function renderDetailPanel(mail) {
        const panel = document.getElementById('detailPanel');
        if (!mail) {
            document.getElementById('panelEmpty').style.display = 'block';
            document.getElementById('panelTitle').innerText = '邮件详情';
            document.getElementById('panelDate').innerHTML = '';
            document.getElementById('panelFrom').innerHTML = '';
            document.getElementById('panelContent').innerHTML = '';
            document.getElementById('panelAttach').innerHTML = '';
            document.getElementById('panelClaimBtn').style.display = 'none';
            document.getElementById('panelDeleteBtn').style.display = 'none';
            return;
        }
        document.getElementById('panelEmpty').style.display = 'none';
        document.getElementById('panelTitle').innerText = mail.title;
        document.getElementById('panelDate').innerHTML = formatDate(mail.created_at);
        document.getElementById('panelFrom').innerHTML = `来自：${escapeHtml(getSenderDisplay(mail))}`;
        document.getElementById('panelContent').innerHTML = escapeHtml(mail.content || '(无内容)').replace(/\n/g, '<br>');

        const items = mail.claimable_items || [];
        const attachDiv = document.getElementById('panelAttach');
        if (items.length === 0) {
            attachDiv.innerHTML = '<em>无附件</em>';
            document.getElementById('panelClaimBtn').style.display = 'none';
        } else {
            let attachHtml = '<strong>📦 附件：</strong><div style="margin-top:6px;">';
            for (const item of items) {
                const info = await getAttachDisplay(item);
                if (info.isImg) {
                    attachHtml += `
                        <div class="attach-item">
                            <img src="${info.icon}" alt="${info.label}">
                            <span class="attach-name">${info.label}</span>
                            <span class="attach-amount">${info.suffix}</span>
                        </div>
                    `;
                } else {
                    attachHtml += `
                        <div class="attach-item">
                            <i class="${info.icon} attach-icon"></i>
                            <span class="attach-name">${info.label}</span>
                            <span class="attach-amount">${info.suffix}</span>
                        </div>
                    `;
                }
            }
            attachHtml += '</div>';
            attachDiv.innerHTML = attachHtml;

            const claimBtn = document.getElementById('panelClaimBtn');
            claimBtn.style.display = 'block';
            const isClaimed = !!mail.claimed_at;
            claimBtn.disabled = isClaimed;
            claimBtn.innerText = isClaimed ? '已领取' : '领取附件';
            claimBtn.onclick = async () => {
                if (claimBtn.disabled) return;
                await claimMail(mail.id);
            };
        }

        const delBtn = document.getElementById('panelDeleteBtn');
        delBtn.style.display = 'block';
        const deletable = isDeletable(mail);
        delBtn.disabled = !deletable;
        delBtn.style.opacity = deletable ? '1' : '0.6';
        delBtn.innerText = deletable ? '删除邮件' : '有未领取附件，不可删除';
        delBtn.onclick = () => {
            if (!deletable) {
                showNotification('该邮件有未领取的附件，请先领取后再删除', 'warning');
                return;
            }
            showConfirm('确定要删除这封邮件吗？', async () => {
                await deleteMail(mail.id);
                closeConfirmModal();
                if (currentSelectedMail && currentSelectedMail.id === mail.id) {
                    renderDetailPanel(null);
                    currentSelectedMail = null;
                }
            });
        };
    }

            if (!deletable) {
                showNotification('该邮件有未领取的附件，请先领取后再删除', 'warning');
                return;
            }
            showConfirm('确定要删除这封邮件吗？', async () => {
                await deleteMail(mail.id);
                closeConfirmModal();
                closeDetailModal();
                if (currentSelectedMail && currentSelectedMail.id === mail.id) {
                    renderDetailPanel(null);
                    currentSelectedMail = null;
                }
            });
        };
        document.getElementById('detailModal').classList.add('show');
    }

    function closeDetailModal() {
        document.getElementById('detailModal').classList.remove('show');
    }

    // ============================================================
    //  加载邮件
    // ============================================================
    async function loadMailsWithRetry() {
        const container = document.getElementById('mailList');
        container.innerHTML = '加载中...';
        loadingError = false;
        try {
            const session = getAuthSession();
            if (!session) throw new Error('未登录，请先登录');
            const token = session.access_token;
            currentUserId = session.user.id;

            // ★ 拉全所有货币字段
            const statsRes = await fetch(
                `${SUPABASE_URL}/rest/v1/user_stats?user_id=eq.${currentUserId}&select=candy_crumbles,rainbow_lollipops,dreamy_syrup,active_points,chest_count`,
                { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } }
            );
            const statsArr = await statsRes.json();
            if (statsArr && statsArr[0]) {
                currentUserStats.candy_crumbles = statsArr[0].candy_crumbles || 0;
                currentUserStats.rainbow_lollipops = statsArr[0].rainbow_lollipops || 0;
                currentUserStats.dreamy_syrup = statsArr[0].dreamy_syrup || 0;
                currentUserStats.active_points = statsArr[0].active_points || 0;
                currentUserStats.chest_count = statsArr[0].chest_count || 0;
            }

            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/user_mails?select=*&to_user_id=eq.${currentUserId}&order=created_at.desc`,
                { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } }
            );
            if (!response.ok) throw new Error(await response.text());
            const mails = await response.json();
            currentMails = mails;

            const adminIds = [...new Set(mails.filter(m => m.created_by_admin && !m.sender_name).map(m => m.created_by_admin))];
            if (adminIds.length) {
                const query = adminIds.map(id => `id=eq.${id}`).join(',');
                const userRes = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?select=id,username&${query}`, {
                    headers: { 'apikey': SUPABASE_KEY }
                });
                if (userRes.ok) {
                    const users = await userRes.json();
                    users.forEach(u => userNamesMap.set(u.id, u.username));
                }
            }
            for (let mail of currentMails) {
                if (!mail.sender_name && mail.created_by_admin) {
                    mail.sender_name = userNamesMap.get(mail.created_by_admin) || '管理员';
                } else if (!mail.sender_name) {
                    mail.sender_name = '系统';
                }
            }
            applyFilter();
            updateUnreadBadge();
        } catch (err) {
            console.error(err);
            loadingError = true;
            container.innerHTML = `<div class="error-tip">❌ 加载失败：${err.message}<br><button class="retry-btn" onclick="location.reload()">重试</button></div>`;
        }
    }

    // ============================================================
    //  事件绑定
    // ============================================================
    document.getElementById('confirmCancelBtn').onclick = closeConfirmModal;
    document.getElementById('confirmOkBtn').onclick = () => {
        if (pendingDeleteAction) pendingDeleteAction();
        closeConfirmModal();
    };
    document.getElementById('deleteAllBtn').onclick = () => {
        showConfirm('⚠️ 全部删除将删除所有已读且无未领取附件的邮件，不可恢复。确定继续吗？', async () => {
            await deleteAllMails();
            closeConfirmModal();
        });
    };
    document.getElementById('closePanelBtn').onclick = () => {
        renderDetailPanel(null);
        currentSelectedMail = null;
    };
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchKeyword = e.target.value;
        applyFilter();
    });
    window.addEventListener('resize', () => {
        if (window.innerWidth >= 768 && window.matchMedia("(orientation: landscape)").matches && currentSelectedMail) {
            renderDetailPanel(currentSelectedMail);
        }
    });
    document.getElementById('rewardConfirmBtn').onclick = closeRewardModal;

    document.getElementById('emailCloseBtn').addEventListener('click', function() {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'closeEmailModal' }, '*');
        }
    });

    // ============================================================
    //  启动
    // ============================================================
    loadMailsWithRetry();
</script>
</body>
</html>
