<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面被站长吃掉了</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #ffe4e1, #fff0f5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 主卡片容器 */
        .card {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 129, 0.2);
            max-width: 600px;
            width: 90%;
        }

        /* 看板娘图片样式 */
        .girl-img {
            max-width: 100%;
            max-height: 45vh;
            border-radius: 15px;
            margin-bottom: 20px;
            
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* 文字样式 */
        h1 {
            color: #ff6b81;
            font-size: 32px;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* 返回首页按钮 */
        .btn {
            display: inline-block;
            background-color: #ff6b81;
            color: #fff;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.4);
        }

        .btn:hover {
            background-color: #ff4757;
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 107, 129, 0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://ysmijycsyzpjoieaknmb.supabase.co/storage/v1/object/public/avatars/xz404.webp" alt="委屈的看板娘拿着404牌子" class="girl-img">
        
        <h1>哎呀！404 Not Found</h1>
        <p>该网页被站长吃掉了... <br> 小兹都委屈得掉眼泪了，快带她回家吧！</p>
        
        <a href="/index.html" class="btn">返回首页</a>
    </div>

</body>
</html>
